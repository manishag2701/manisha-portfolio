  <text x="130" y="225" font-family="Arial,sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Hazards</text>
  <rect x="195" y="155" width="90" height="80" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
