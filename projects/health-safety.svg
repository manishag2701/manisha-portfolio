  <text x="670" y="154" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">80% Complete</text>
  <rect x="600" y="170" width="140" height="28" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="670" y="189" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle">✅ Module 1</text>
  <rect x="600" y="206" width="140" height="28" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="670" y="225" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle">✅ Module 2</text>
  <rect x="600" y="242" width="140" height="28" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="670" y="261" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">▶ Module 3</text>
  <rect x="600" y="278" width="140" height="28" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="670" y="297" font-family="Arial,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">🔒 Module 4</text>
  <text x="400" y="460" font-family="Georgia,serif" font-size="16" fill="#15803d" text-anchor="middle" opacity="0.6">Health &amp; Safety · Compliance Training</text>
