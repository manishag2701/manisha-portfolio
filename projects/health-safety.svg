<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="700" cy="80" r="120" fill="#16a34a" opacity="0.10"/>
  <circle cx="100" cy="400" r="90" fill="#22c55e" opacity="0.10"/>
  <!-- Main slide -->
  <rect x="60" y="60" width="500" height="330" rx="18" fill="white" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="60" y="60" width="500" height="72" rx="18" fill="#16a34a"/>
  <rect x="60" y="112" width="500" height="20" fill="#16a34a"/>
  <text x="310" y="90" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Health &amp; Safety in the Workplace</text>
  <text x="310" y="113" font-family="Arial,sans-serif" font-size="12" fill="#bbf7d0" text-anchor="middle">Module 3: Hazard Identification</text>
  <!-- Icons row -->
  <rect x="85" y="155" width="90" height="80" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
