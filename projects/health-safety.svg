  <rect x="580" y="80" width="180" height="300" rx="16" fill="white" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="670" y="115" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">Progress</text>
  <rect x="600" y="128" width="140" height="8" rx="4" fill="#dcfce7"/>
