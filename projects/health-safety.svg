  <text x="240" y="225" font-family="Arial,sans-serif" font-size="10" fill="#15803d" text-anchor="middle">PPE</text>
  <rect x="305" y="155" width="90" height="80" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="350" y="200" font-family="Georgia,serif" font-size="30" text-anchor="middle">🚨</text>
  <text x="350" y="225" font-family="Arial,sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Emergency</text>
  <rect x="415" y="155" width="90" height="80" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="460" y="200" font-family="Georgia,serif" font-size="30" text-anchor="middle">✅</text>
  <text x="460" y="225" font-family="Arial,sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Compliance</text>
  <!-- Scenario text -->
  <rect x="85" y="252" width="420" height="14" rx="7" fill="#dcfce7"/>
  <rect x="85" y="274" width="360" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="85" y="292" width="390" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="85" y="310" width="340" height="10" rx="5" fill="#e5e7eb"/>
  <!-- Quiz button -->
  <rect x="85" y="334" width="160" height="40" rx="10" fill="#16a34a"/>
  <text x="165" y="359" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Take Quiz →</text>
