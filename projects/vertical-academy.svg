<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf0f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9d6e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffe4f0;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="120" fill="#f06292" opacity="0.12"/>
  <circle cx="100" cy="420" r="90" fill="#e91e8c" opacity="0.10"/>
  <circle cx="720" cy="380" r="60" fill="#f48fb1" opacity="0.15"/>
  <!-- Main card -->
  <rect x="80" y="80" width="420" height="280" rx="20" fill="url(#card)" stroke="#f9a8d4" stroke-width="1.5"/>
  <!-- Header bar -->
  <rect x="80" y="80" width="420" height="56" rx="20" fill="#f06292"/>
  <rect x="80" y="116" width="420" height="20" fill="#f06292"/>
  <text x="290" y="115" font-family="Georgia,serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Vertical Academy</text>
  <!-- Content lines -->
  <rect x="110" y="160" width="240" height="12" rx="6" fill="#f9a8d4" opacity="0.7"/>
  <rect x="110" y="182" width="180" height="12" rx="6" fill="#f9a8d4" opacity="0.5"/>
  <rect x="110" y="210" width="360" height="8" rx="4" fill="#e5e7eb" opacity="0.8"/>
  <rect x="110" y="226" width="320" height="8" rx="4" fill="#e5e7eb" opacity="0.8"/>
  <rect x="110" y="242" width="340" height="8" rx="4" fill="#e5e7eb" opacity="0.8"/>
  <!-- Progress bars -->
  <rect x="110" y="270" width="360" height="10" rx="5" fill="#fce7f3"/>
  <rect x="110" y="270" width="240" height="10" rx="5" fill="#f06292"/>
  <rect x="110" y="290" width="360" height="10" rx="5" fill="#fce7f3"/>
  <rect x="110" y="290" width="300" height="10" rx="5" fill="#e91e8c"/>
  <rect x="110" y="310" width="360" height="10" rx="5" fill="#fce7f3"/>
  <rect x="110" y="310" width="180" height="10" rx="5" fill="#f48fb1"/>
  <!-- Side panel -->
  <rect x="540" y="100" width="200" height="300" rx="16" fill="white" opacity="0.85" stroke="#f9a8d4" stroke-width="1"/>
  <rect x="560" y="120" width="60" height="60" rx="12" fill="#fce7f3"/>
  <text x="590" y="158" font-family="Georgia,serif" font-size="28" fill="#f06292" text-anchor="middle">📚</text>
  <rect x="560" y="196" width="160" height="10" rx="5" fill="#f9a8d4" opacity="0.6"/>
  <rect x="560" y="214" width="120" height="10" rx="5" fill="#e5e7eb" opacity="0.8"/>
  <rect x="560" y="240" width="160" height="8" rx="4" fill="#e5e7eb" opacity="0.6"/>
  <rect x="560" y="256" width="140" height="8" rx="4" fill="#e5e7eb" opacity="0.6"/>
  <rect x="560" y="272" width="150" height="8" rx="4" fill="#e5e7eb" opacity="0.6"/>
  <rect x="560" y="310" width="160" height="36" rx="10" fill="#f06292"/>
  <text x="640" y="333" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Start Learning</text>
  <!-- Bottom label -->
  <text x="400" y="450" font-family="Georgia,serif" font-size="16" fill="#9d174d" text-anchor="middle" opacity="0.6">Curriculum Development · Online Academy</text>
</svg>
