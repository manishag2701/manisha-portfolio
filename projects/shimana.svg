<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2d1052;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f0abfc;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a21caf;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="200" fill="url(#glow1)"/>
  <circle cx="600" cy="300" r="160" fill="url(#glow2)"/>
  <!-- Stars -->
  <circle cx="120" cy="80" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="300" cy="40" r="1" fill="white" opacity="0.5"/>
  <circle cx="500" cy="60" r="2" fill="white" opacity="0.4"/>
  <circle cx="680" cy="100" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="750" cy="200" r="1" fill="white" opacity="0.5"/>
  <circle cx="50" cy="300" r="1.5" fill="white" opacity="0.4"/>
  <!-- Central mandala-like circle -->
  <circle cx="400" cy="220" r="100" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
  <circle cx="400" cy="220" r="70" fill="none" stroke="#e879f9" stroke-width="1" opacity="0.5"/>
  <circle cx="400" cy="220" r="40" fill="#7e22ce" opacity="0.6"/>
  <text x="400" y="232" font-family="Georgia,serif" font-size="32" fill="#f0abfc" text-anchor="middle">✦</text>
  <!-- Title -->
  <text x="400" y="80" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#f0abfc" text-anchor="middle">Shimana Quantum Code</text>
  <text x="400" y="108" font-family="Arial,sans-serif" font-size="14" fill="#c084fc" text-anchor="middle">Spiritual Mind &amp; Healing</text>
  <!-- Module cards -->
  <rect x="60" y="340" width="160" height="100" rx="14" fill="#3b0764" stroke="#7e22ce" stroke-width="1"/>
  <text x="140" y="380" font-family="Georgia,serif" font-size="22" text-anchor="middle">🧘</text>
  <text x="140" y="405" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e879f9" text-anchor="middle">Mindfulness</text>
  <text x="140" y="422" font-family="Arial,sans-serif" font-size="10" fill="#a855f7" text-anchor="middle">Module 1</text>
  <rect x="240" y="340" width="160" height="100" rx="14" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
  <text x="320" y="380" font-family="Georgia,serif" font-size="22" text-anchor="middle">💫</text>
  <text x="320" y="405" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e879f9" text-anchor="middle">Inner Healing</text>
  <text x="320" y="422" font-family="Arial,sans-serif" font-size="10" fill="#a855f7" text-anchor="middle">Module 2</text>
  <rect x="420" y="340" width="160" height="100" rx="14" fill="#3b0764" stroke="#7e22ce" stroke-width="1"/>
  <text x="500" y="380" font-family="Georgia,serif" font-size="22" text-anchor="middle">🌙</text>
  <text x="500" y="405" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e879f9" text-anchor="middle">Spiritual Growth</text>
  <text x="500" y="422" font-family="Arial,sans-serif" font-size="10" fill="#a855f7" text-anchor="middle">Module 3</text>
  <rect x="600" y="340" width="160" height="100" rx="14" fill="#3b0764" stroke="#7e22ce" stroke-width="1"/>
  <text x="680" y="380" font-family="Georgia,serif" font-size="22" text-anchor="middle">✨</text>
  <text x="680" y="405" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e879f9" text-anchor="middle">Awakening</text>
  <text x="680" y="422" font-family="Arial,sans-serif" font-size="10" fill="#a855f7" text-anchor="middle">Module 4</text>
</svg>
